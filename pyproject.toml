[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "kodharitalama"
version = "0.30.103"
description = "Kod haritalama ve sorgulanabilir bilgi grafiği aracı. Yazılımcı: Murat ŞAHİN — Şahin Yazılım Evi. Graphify projesinden uyarlanmıştır."
readme = "README.md"
authors = [{ name = "Murat ŞAHİN" }]
maintainers = [{ name = "Şahin Yazılım Evi" }]
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSE-MIT", "NOTICE"]
keywords = ["claude", "claude-code", "codex", "opencode", "kilo", "cursor", "gemini", "aider", "kiro", "pi", "devin", "knowledge-graph", "rag", "graphrag", "obsidian", "community-detection", "tree-sitter", "leiden", "llm"]
requires-python = ">=3.10"
dependencies = [
    "networkx==3.4.2; python_full_version < '3.11'",
    "networkx==3.6.1; python_full_version == '3.11.*'",
    "networkx==3.7; python_full_version >= '3.12'",
    "numpy==1.26.4; python_full_version < '3.13'",
    "numpy==2.5.4; python_full_version >= '3.13'",
    "rapidfuzz==3.14.5; python_full_version < '3.11'",
    "rapidfuzz==3.14.6; python_full_version >= '3.11'",
    # Structural YAML extraction (#2214) plus manifest/markdown config parsing.
    "pyyaml==6.0.3",
    "tomli==2.5.0; python_version < '3.11'",
    # Runtime floor is 0.25, not 0.23: 0.23/0.24 cap out at ABI 14
    # (LANGUAGE_VERSION=14) while the grammars pinned below ship ABI 15
    # (e.g. tree-sitter-javascript 0.25.0, tree-sitter-powershell 0.26.x).
    # A resolver is free to pick 0.23.2 for the runtime and 0.25.x for the
    # grammars, which then fails every parse with "Incompatible Language
    # version 15". Floor at the oldest runtime that can load them; this also
    # matches what uv.lock already resolves to.
    "tree-sitter==0.25.2",
    "tree-sitter-python==0.25.0",
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-typescript==0.23.2",
    "tree-sitter-go==0.25.0",
    "tree-sitter-rust==0.24.2",
    "tree-sitter-java==0.23.5",
    "tree-sitter-groovy==0.1.2",
    "tree-sitter-c==0.24.2",
    "tree-sitter-cpp==0.23.4",
    "tree-sitter-ruby==0.23.1",
    "tree-sitter-c-sharp==0.23.5",
    "tree-sitter-kotlin==1.1.0",
    "tree-sitter-scala==0.26.3",
    "tree-sitter-php==0.24.1",
    "tree-sitter-swift==0.7.4",
    "tree-sitter-lua==0.5.0",
    "tree-sitter-zig==1.1.2",
    "tree-sitter-powershell==0.26.4",
    "tree-sitter-elixir==0.3.5",
    "tree-sitter-objc==3.0.2",
    "tree-sitter-julia==0.23.1",
    "tree-sitter-verilog==1.0.3",
    "tree-sitter-fortran==0.6.0",
    "tree-sitter-bash==0.25.1",
    "tree-sitter-json==0.24.8",
]

[project.urls]
"Upstream Project" = "https://github.com/Graphify-Labs/graphify"

[project.optional-dependencies]
mcp = [
    "mcp==2.3.0",
    "starlette==1.7.0; python_full_version < '3.11'",
    "starlette==1.9.0; python_full_version >= '3.11'",
    "anyio==4.15.1",
]

neo4j = [
    "neo4j==6.4.1",
]

falkordb = [
    "falkordb==1.8.0",
]

pdf = [
    "pypdf==6.21.2",
    "markdownify==1.2.3",
]

watch = [
    "watchdog==6.0.0",
]

svg = [
    "matplotlib==3.10.9; python_full_version < '3.11'",
    "matplotlib==3.11.2; python_full_version >= '3.11'",
    "pillow==12.3.0; python_version >= '3.11' and python_full_version < '3.11'",
    "pillow==13.0.0; python_version >= '3.11' and python_full_version >= '3.11'",
    "pillow==12.3.0; python_version < '3.11' and python_full_version < '3.11'",
    "pillow==13.0.0; python_version < '3.11' and python_full_version >= '3.11'",
    "numpy==2.5.4; python_version >= '3.13'",
]

leiden = [
    "graspologic==3.4.4; python_version < '3.13'",
    "graspologic-native==1.3.1; python_version >= '3.13'",
# --postgres reconstructs DDL and feeds it to extract_sql(), which needs the
# tree-sitter-sql grammar; without it introspection silently returns 0 nodes,
# so the postgres extra must carry the grammar too.
# faster-whisper 1.2.1 (current PyPI release) decodes audio with
# `av.open(..., metadata_errors="ignore")`. PyAV 19.0.0 removed that
# argument; 16.1.0 through 18.1.0 still accept it. faster-whisper only
# requires `av>=11`, so a fresh `[video]` install on Python 3.12+ resolves
# av 19 and transcription raises
# `TypeError: open() got an unexpected keyword argument 'metadata_errors'`.
# Cap PyAV below 19 on the same interpreter marker as faster-whisper
# (Python 3.10 never installs it). The unreleased faster-whisper master
# already omits the argument on PyAV 19; drop this cap once that ships.
]

office = [
    "python-docx==1.2.0",
    "openpyxl==3.1.5",
]

google = [
    "openpyxl==3.1.5",
]

postgres = [
    "psycopg[binary]==3.3.6",
    "tree-sitter-sql==0.3.11",
]

video = [
    "faster-whisper==1.2.1; python_version >= '3.11'",
    "av==18.1.0; python_version >= '3.11'",
    "yt-dlp==2026.10.21",
]

kimi = [
    "openai==3.37.0",
    "tiktoken==0.14.0",
]

ollama = [
    "openai==3.37.0",
]

bedrock = [
    "boto3==1.43.118",
]

anthropic = [
    "anthropic==2.2.0",
]

gemini = [
    "openai==3.37.0",
    "tiktoken==0.14.0",
]

openai = [
    "openai==3.37.0",
    "tiktoken==0.14.0",
]

chinese = [
    "jieba==0.42.1; python_version < '3.12'",
    "jieba-py==0.46.12; python_version >= '3.12'",
# extract_pascal() uses tree-sitter-pascal for AST-quality extraction (more
# accurate calls/inherits edges) and falls back to a regex extractor when it is
# absent (#781), so this stays optional. Unlike tree-sitter-dm below, it ships
# prebuilt wheels for every platform (win/macOS/Linux), so no C toolchain needed.
# tree-sitter-dm (BYOND DreamMaker) ships only a Windows wheel, so on Linux/Mac it
# must compile from source (needs a C toolchain + python3-dev). Keeping it optional
# avoids breaking the default `uv tool install graphifyy` for everyone (#1104).
# Capped <0.26: the 0.26.0 grammar changed the type-path node shape, so
# extract_dm() stops finding type definitions (a fresh `uvx --from graphifyy[dm]`
# would otherwise pull it and silently break DM extraction). uv.lock pins 0.25.1.
# tree-sitter-ocaml ships prebuilt abi3 wheels for every platform, so no C
# toolchain is needed; kept optional because OCaml is a niche corpus language.
# tree-sitter-commonlisp ships prebuilt abi3 wheels for every platform; optional
# because Common Lisp is a niche corpus language.
# The official Robot Framework parser (robot.api) - pure Python, wheels for
# every platform, no C toolchain; optional because Robot Framework corpora are
# QA-automation specific.
# No standalone tree-sitter-r / tree-sitter-erlang wheel exists on PyPI; the
# language pack bundles both grammars in a prebuilt, offline-compatible wheel.
# Optional extras (large shared dep, resolved once in `all`).
]

sql = [
    "tree-sitter-sql==0.3.11",
]

pascal = [
    "tree-sitter-pascal==0.11.0",
]

dm = [
    "tree-sitter-dm==0.25.4",
]

terraform = [
    "tree-sitter-hcl==1.2.0",
]

ocaml = [
    "tree-sitter-ocaml==0.26.0",
]

commonlisp = [
    "tree-sitter-commonlisp==0.4.1",
]

robot = [
    "robotframework==7.5",
]

vbnet = [
    "tree-sitter-vb-dotnet==0.3.0",
]

r = [
    "tree-sitter-language-pack==0.11.0",
]

erlang = [
    "tree-sitter-language-pack==0.11.0",
]

solidity = [
    "tree-sitter-solidity==1.2.13",
]

all = [
    "mcp==2.3.0",
    "starlette==1.7.0; python_full_version < '3.11'",
    "starlette==1.9.0; python_full_version >= '3.11'",
    "anyio==4.15.1",
    "neo4j==6.4.1",
    "falkordb==1.8.0",
    "pypdf==6.21.2",
    "markdownify==1.2.3",
    "watchdog==6.0.0",
    "matplotlib==3.10.9; python_full_version < '3.11'",
    "matplotlib==3.11.2; python_full_version >= '3.11'",
    "pillow==12.3.0; python_version >= '3.11' and python_full_version < '3.11'",
    "pillow==13.0.0; python_version >= '3.11' and python_full_version >= '3.11'",
    "pillow==12.3.0; python_version < '3.11' and python_full_version < '3.11'",
    "pillow==13.0.0; python_version < '3.11' and python_full_version >= '3.11'",
    "numpy==2.5.4; python_version >= '3.13'",
    "graspologic==3.4.4; python_version < '3.13'",
    "graspologic-native==1.3.1; python_version >= '3.13'",
    "python-docx==1.2.0",
    "openpyxl==3.1.5",
    "psycopg[binary]==3.3.6",
    "tree-sitter-sql==0.3.11",
    "faster-whisper==1.2.1; python_version >= '3.11'",
    "av==18.1.0; python_version >= '3.11'",
    "yt-dlp==2026.10.21",
    "openai==3.37.0",
    "tiktoken==0.14.0",
    "boto3==1.43.118",
    "anthropic==2.2.0",
    "jieba==0.42.1; python_version < '3.12'",
    "jieba-py==0.46.12; python_version >= '3.12'",
    "tree-sitter-pascal==0.11.0",
    "tree-sitter-dm==0.25.4",
    "tree-sitter-hcl==1.2.0",
    "tree-sitter-ocaml==0.26.0",
    "tree-sitter-commonlisp==0.4.1",
    "robotframework==7.5",
    "tree-sitter-vb-dotnet==0.3.0",
    "tree-sitter-language-pack==0.11.0",
    "tree-sitter-solidity==1.2.13",
]
[project.scripts]
kodharitalama = "graphify.__main__:main"
kodharitalama-mcp = "graphify.serve:_main"
# Compatibility aliases: the import package and existing editor integrations
# still use the historical ``graphify`` command name.
graphify = "graphify.__main__:main"
graphify-mcp = "graphify.serve:_main"

[dependency-groups]
dev = [
    "bandit==1.9.4",
    "build==1.6.1",
    "hypothesis==6.168.5; python_full_version < '3.11'",
    "hypothesis==6.170.8; python_full_version >= '3.11'",
    "nuitka==4.3.1",
    "patchelf==0.19.1.0 ; sys_platform != 'win32'",
    "pip-audit==2.10.1",
    "pre-commit==4.6.2; python_full_version < '3.11'",
    "pre-commit==4.7.0; python_full_version >= '3.11'",
    "pyright==1.1.414",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.2",
    "setuptools==84.2.1",
    "wheel==0.48.0",
    "tomli==2.5.0 ; python_version < '3.11'",
    "tree-sitter-hcl==1.2.0",
    "tree-sitter-ocaml==0.26.0",
    "tree-sitter-commonlisp==0.4.1",
]

[tool.uv]
# This checkout is never installed from a package index. Install the
# hash-locked default set with:
#   python -m pip install --require-hashes -r requirements.lock
# and run the CLI from the checkout with `python -m graphify`.
# Optional extras must be staged as reviewed wheels and installed with
# --no-index --find-links <dir>; see SECURITY.md.
package = true

[tool.setuptools]
packages = ["graphify", "graphify.extractors", "graphify.exporters"]
include-package-data = false

[tool.setuptools.package-data]
# The skill bodies ship as graphify/skill*.md (the SKILL.md a host installs is
# copied from one of these). The progressive-disclosure references sidecar ships
# under graphify/skills/<host>/references/, and the always-on injection blocks
# under graphify/always_on/. There is no graphify/skills/<host>/SKILL.md in the
# repo, so no SKILL.md glob is needed here.
# graphify/pi/ is the native Pi guard package; Pi registers it in place from the installation.
graphify = ["skill.md", "skill-codex.md", "skill-opencode.md", "skill-kilo.md", "command-kilo.md", "skill-aider.md", "skill-amp.md", "skill-agents.md", "skill-copilot.md", "skill-claw.md", "skill-windows.md", "skill-droid.md", "skill-trae.md", "skill-kiro.md", "skill-vscode.md", "skill-pi.md", "skill-devin.md", "skills/*/references/*.md", "always_on/*.md", "pi/package.json", "pi/index.ts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    "graphify-benchmark", "graphify_eval", "graphify_test",
    "worked", "llm-stack-corpus", "llm-stack-demo", "product-site",
    "scripts", "ebook", ".github", "dist", "build",
]

[tool.bandit]
skips = ["B404"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Keep the committed baseline conservative until upstream adopts a broader lint policy.
select = ["E9", "F63", "F7", "F82"]

[tool.pyright]
include = ["graphify", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
